[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.100"

[workspace.dependencies]
skriv-model = { path = "crates/model" }
skriv-odf = { path = "crates/odf" }
quick-xml = "0.42"
zip = { version = "9.6", default-features = false, features = ["deflate"] }
uuid = { version = "1.29", features = ["v7"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
rayon = "1.12"
walkdir = "2.5"
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimise dependencies (Loro, Automerge, zip…) even in debug builds: the
# CRDT tests replay thousands of merges. Workspace crates stay debuggable.
[profile.dev.package."*"]
opt-level = 2

# Generic code from Loro and Automerge (Automerge's update_spans, for one)
# is compiled into skriv-crdt; unoptimised it is ~80x slower.
[profile.dev.package.skriv-crdt]
opt-level = 1
