# cargo-deny: licence policy for the skriv workspace (ADR 0005).
# The core may only depend on permissive or file-level-copyleft licences.
# AGPL, GPL and LGPL are not in the allow list, so they fail the check.

[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
