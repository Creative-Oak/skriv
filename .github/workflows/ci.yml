name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: the full LibreOffice corpus.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The oracle is pinned (ADR 0003). This is the official TDF build, not
  # Ubuntu's package, so CI and local runs see the same LibreOffice.
  LO_VERSION: 26.8.1.1
  LO_URL: https://downloadarchive.documentfoundation.org/libreoffice/old/26.8.1.1/deb/x86_64/LibreOffice_26.8.1.1_Linux_x86-64_deb.tar.gz

jobs:
  rust:
    name: Rust (fmt, clippy, tests, licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  typescript:
    name: TypeScript tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  fidelity:
    name: Fidelity harness (LibreOffice oracle)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - name: Cache LibreOffice
        id: lo-cache
        uses: actions/cache@v4
        with:
          path: ~/lo-debs
          key: libreoffice-${{ env.LO_VERSION }}
      - name: Download LibreOffice ${{ env.LO_VERSION }}
        if: steps.lo-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/lo-debs
          curl -sSL "$LO_URL" | tar -xz -C ~/lo-debs --strip-components=1
      - name: Install LibreOffice and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-liberation fonts-dejavu-core
          sudo dpkg -i ~/lo-debs/DEBS/*.deb || sudo apt-get install -f -y
          SOFFICE="$(ls -d /opt/libreoffice*/program/soffice | head -1)"
          echo "SKRIV_SOFFICE=$SOFFICE" >> "$GITHUB_ENV"
          "$SOFFICE" --version
      - run: cargo build --release -p skriv-fidelity
      - name: Generated corpus (every push)
        run: >
          ./target/release/skriv-fidelity run fidelity/corpus/generated
          --canary --enforce --workers 2
          --out fidelity/reports/ci-generated --work fidelity/work/ci-generated
      - name: LibreOffice corpus (nightly and manual runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          fidelity/scripts/fetch-lo-corpus.sh
          ./target/release/skriv-fidelity run fidelity/corpus/libreoffice \
            --canary --enforce --workers 4 \
            --out fidelity/reports/ci-libreoffice --work fidelity/work/ci-libreoffice
      - name: LibreOffice preservation findings (nightly and manual runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 -I fidelity/scripts/lo_preservation.py --out fidelity/reports/ci-preservation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-reports
          path: fidelity/reports/
