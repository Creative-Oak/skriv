[package]
name = "skriv-proofing"
version = "0.0.0"
description = "Spike 6: language detection per paragraph and Hunspell-format spell checking for documents that mix Danish and English."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["lingua", "lingua-confusers", "whatlang"]
lingua = ["dep:lingua", "lingua/danish", "lingua/english"]
# Norwegian Bokmål and Swedish models, to try them as confusers.
lingua-confusers = ["lingua", "lingua/bokmal", "lingua/swedish"]
whatlang = ["dep:whatlang"]

[dependencies]
spellbook = "0.4.2"
# Only the models we need (see the features): every other language model
# stays out of the build.
lingua = { version = "1.8.0", default-features = false, optional = true }
whatlang = { version = "0.18.0", optional = true }
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "spike6"
required-features = ["lingua", "lingua-confusers", "whatlang"]

[lints]
workspace = true
